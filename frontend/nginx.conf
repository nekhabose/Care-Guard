# Serves the SPA and reverse-proxies the API to the backend container, so the
# browser sees a single origin (no CORS, no host baked into the bundle).
# `backend` resolves via docker-compose's service network.

upstream careguard_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + auth routes -> FastAPI. Add new top-level API prefixes here.
    location ~ ^/(auth|dashboard|webhooks|twilio|health|docs|openapi.json) {
        proxy_pass http://careguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the Twilio media stream (/twilio/ws/...).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # SPA fallback — client-side routing (React Router) handles the rest.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
